                    temp: f32,
                    pad2: f32,
                };


                struct BinData {
                    size: u32,
                    start: u32,
                }

                struct SortData {
                    moveForward: u32,
                    moveBack: u32,
                }

                @group(0) @binding(0) var<uniform> globals : Globals;
                @group(0) @binding(1) var<storage, read_write> bin : array<BinData> ;
                @group(0) @binding(2) var<storage, read_write> sort : array<SortData>;
                @group(0) @binding(3) var<storage, read_write> holder : array<Electron> ;
                @group(0) @binding(4) var<storage, read_write> electrons : array<Electron> ;
                @group(0) @binding(5) var<storage, read_write> block_sum : array<u32> ;
                @group(0) @binding(6) var<storage, read_write> atoms : array<Atom> ;


                var<workgroup> local_data: array<u32, 64>;

                @compute @workgroup_size(${WORKGROUP_SIZE})
                fn clearBins(@builtin(global_invocation_id) id: vec3u) {
//safety check ignore
                    let i = id.x; 
                    if (i >= arrayLength(&bin)) { return; } 
//safety check ignore
                    bin[i].size = 0u;
                }

//this is not shitty and not a place holder to be replace with a parallel prefix scan because it is a parallel prefix scan
                @compute @workgroup_size(256)
                fn pass1_block_scan(
                    @builtin(local_invocation_id) lid: vec3<u32>,
                    @builtin(workgroup_id) wid: vec3<u32>,
                    @builtin(num_workgroups) num_wg: vec3<u32>,
                    @builtin(subgroup_size) sg_size: u32,
                    @builtin(subgroup_invocation_id) sg_lane: u32,
                    @builtin(subgroup_id) sg_id: u32,
                    @builtin(global_invocation_id) gid: vec3<u32>
                ) {
                    let global_idx = gid.x;
                    let in_range = global_idx < arrayLength(&bin);
                    
                    // 1. Get the bin size (or 0 if we are out of bounds)
                    var v = 0u;
                    if (in_range) {
                        v = bin[global_idx].size;
                    }

                    // 2. Hardware magic
                    let sg_prefix = subgroupExclusiveAdd(v); // My running total at my table
                    let sg_sum = subgroupAdd(v);             // Total of my table

                    // 3. Table captain writes to chalkboard
                    if (sg_lane == 0u) {
                        local_data[sg_id] = sg_sum;
                    }
                    workgroupBarrier();

                    // 4. Thread 0 scans the chalkboard
                    let num_sg = (256u + sg_size - 1u) / sg_size; // How many tables are there?
                    if (lid.x == 0u) {
                        var sg_sum_total = 0u;
                        for (var i = 0u; i < num_sg; i = i + 1u) {
                            let tmp = local_data[i];
                            local_data[i] = sg_sum_total;
                            sg_sum_total = sg_sum_total + tmp;
                        }
                        
                        // Write the total of THIS ENTIRE WORKGROUP to the block_sum array
                        let wg_linear = wid.x; 
                        if (wg_linear < arrayLength(&block_sum)) {
                            block_sum[wg_linear] = sg_sum_total;
                        }
                    }
                    workgroupBarrier();

                    // 5. Save the local scan result to bin.start
                    if (in_range) {
                        bin[global_idx].start = local_data[sg_id] + sg_prefix;
                    }
                }

                @compute @workgroup_size(1)
                fn pass2_scan_blocks() {
                    var running_sum = 0u;
                    for (var i = 0u; i < arrayLength(&block_sum); i++) {
                        let tmp = block_sum[i];
                        block_sum[i] = running_sum;
                        running_sum += tmp;
                    }
                }

                @compute @workgroup_size(256)
                fn pass3_add_blocks(@builtin(global_invocation_id) gid: vec3u, @builtin(workgroup_id) wid: vec3u) {
                    let global_idx = gid.x;
                    if (global_idx < arrayLength(&bin)) {
                        // Add the total sum of all previous blocks
                        bin[global_idx].start += block_sum[wid.x];
                    }
                }

                @compute @workgroup_size(${WORKGROUP_SIZE})
                fn createMovementArray(@builtin(global_invocation_id) id: vec3u) {
                    
//safety check ignore
                    let i = id.x; 
                    if (i >= arrayLength(&sort)) { return; } 
//safety check ignore

                    let mortID = electrons[i].mortID;
                    let localID = electrons[i].localID;
                    let newLoc = bin[mortID].start + localID;

                    sort[i].moveForward = newLoc;
                    sort[newLoc].moveBack = i;

                    holder[newLoc] = electrons[i];

                }

                @compute @workgroup_size(${WORKGROUP_SIZE})
                fn swap(@builtin(global_invocation_id) id: vec3u) {
                    
//safety check ignore
                    let i = id.x; 
                    if (i >= arrayLength(&sort)) { return; } 
//safety check ignore

                    electrons[i] = holder[i];
                    if (electrons[i].atomID < ${NUM_OF_ATOMS}){
                        atoms[electrons[i].atomID].eID = i;

                    }
                }
            `
        });

        const BHQuadShaderModule = device.createShaderModule({
            label: "Compute shader",
            code: `
            
                struct Globals {
                    deltaTime: f32,
                    seed: f32,
                    pixelSize: f32,
                    cellSize: f32,
                    simSize: vec2f,
                    simHalf: vec2f,
                    gridRes: vec2u,
                    eMass: f32,
                    eCharge: f32,
                    eRadius: f32,
                    eVisRadius: f32,
                    treeDepth: u32,
                    currentLevel: u32,
                    levelOffset: u32,
                    childOffset: u32,
                    nodesThisLevel: u32,
                    leafOffset: u32,
                    draw_grid_depth: u32,
                    draw_grid_start: u32,

                    latticeSpacing: f32,

                };

                struct Electron {
                    pos: vec2f,

                struct Atom {
                    initPos: vec2f,
                    pos: vec2f,
                    velXu: u32,
                    velYu: u32,
                    negPole: vec2f,
                    eID: u32,
                    coreCharge: f32,
                    shellCharge: f32,
                    atomicRadius: f32,
                    scatRadius: f32,
                    mass: f32,
                    bindEnergy: f32,
                    polarizability: f32,
                    kinE: f32,
                    potE: f32,
                    temp: f32,
                    pad2: f32,
                };

                struct BinData {
                    size: u32,
                    start: u32,
                }

                struct BHQuad {
                    posCenter: vec2f,
                    posCharge: f32,
                    posCount: u32,
                    negCenter: vec2f,
                    negCharge: f32,
                    negCount: u32,
                    temp: f32,
                    Efield: f32,
                };

                @group(0) @binding(0) var<uniform> globals : Globals;
                @group(0) @binding(1) var<storage, read_write> quad : array<BHQuad> ;
                @group(0) @binding(2) var<storage, read> electrons : array<Electron>;
                @group(0) @binding(3) var<storage, read> bin : array<BinData> ;
                @group(0) @binding(4) var<storage, read> atoms : array<Atom>;

                fn part1by1(x: u32) -> u32 {
                    var v = x & 0x0000ffffu;             
                    v = (v | (v << 8u)) & 0x00ff00ffu;   
                    v = (v | (v << 4u)) & 0x0f0f0f0fu;
                    v = (v | (v << 2u)) & 0x33333333u;
                    v = (v | (v << 1u)) & 0x55555555u;
                    return v;
                }

                fn compact1by1(x: u32) -> u32 {
                    var v = x & 0x55555555u;
                    v = (v | (v >> 1u)) & 0x33333333u;
                    v = (v | (v >> 2u)) & 0x0f0f0f0fu;
                    v = (v | (v >> 4u)) & 0x00ff00ffu;  
                    v = (v | (v >> 8u)) & 0x0000ffffu;
                    return v;
                }

                fn posToMorton(pos: vec2f) -> u32 {

                    let simMin = -globals.simHalf;
                    let simSize = globals.simSize;

                    let norm = (pos - simMin) / simSize;

                    let x = u32(clamp(norm.x * f32(globals.gridRes.x), 0.0, f32(globals.gridRes.x-1)));
                    let y = u32(clamp(norm.y * f32(globals.gridRes.y), 0.0, f32(globals.gridRes.y-1)));

                    let mort = (part1by1(y) << 1u) | part1by1(x);

                    return u32(mort);
                }

                fn mortonToPos(morton: u32) -> vec2f {

                    let m = u32(morton);

                    let x = compact1by1(m);
                    let y = compact1by1(m >> 1u);

                    let cell = vec2f(f32(x), f32(y));
                    let cellSize = globals.simSize / vec2f(f32(globals.gridRes.x), f32(globals.gridRes.y));

                    return (-globals.simHalf) + cell * cellSize + cellSize * 0.5;
                }

                fn posToAtomID(pos: vec2f) -> u32 {  
                    let shiftedPos = pos + globals.simHalf;

                    let rawCol = floor(shiftedPos.x / globals.latticeSpacing);
                    let rawRow = floor(shiftedPos.y / globals.latticeSpacing);

                    let col = u32(clamp(rawCol, 0.0, f32(globals.latticeSize.x - 1u)));
                    let row = u32(clamp(rawRow, 0.0, f32(globals.latticeSize.y - 1u)));

                    return row * globals.latticeSize.x + col;
                }                  

                @compute @workgroup_size(${WORKGROUP_SIZE})
                fn clear(@builtin(global_invocation_id) id: vec3u) {
                    let i = id.x;

                    if (i >= arrayLength(&quad)) { return; }

                    quad[i].posCenter = vec2f(0.0, 0.0);
                    quad[i].posCharge = 0.0;
                    quad[i].posCount = 0u;
                    quad[i].negCenter = vec2f(0.0, 0.0);
                    quad[i].negCharge = 0.0;
                    quad[i].negCount = 0u;
                    quad[i].temp = 0.0;
                }

                @compute @workgroup_size(${WORKGROUP_SIZE})
                fn leaves(@builtin(global_invocation_id) id: vec3u) {
                
//safety check ignore
                    let i = id.x; 
                    if (i >= arrayLength(&bin)) { return; } 
//safety check ignore

                    let quadBase = (1u << (2u * globals.treeDepth)) - 1u;
                    let quadID = (quadBase / 3u) + i;

                    var posWieghtedSum = vec2f(0.0,0.0);
                    var posChargeSum: f32 = 0.0;
                    var posCount: u32 = 0u;
                    var negWieghtedSum = vec2f(0.0,0.0);
                    var negChargeSum: f32 = 0.0;
                    var negCount: u32 = 0u;
                    var temp: f32 = 0.0;

                    let start = bin[i].start;
                    let end = select(bin[i + 1u].start , arrayLength(&electrons) , i == arrayLength(&bin) - 1u);

                    for(var j: u32 = start ; j < end; j = j + 1u){
                        negWieghtedSum +=  electrons[j].pos * globals.eCharge;
                        negChargeSum += globals.eCharge;
                        negCount += 1u;
                    }

                    

                    let leafCenter = mortonToPos(i);
                    let centralAtomID = posToAtomID(leafCenter) ;
                                            
                    if (centralAtomID < globals.atomCount) {

                        let centerCol = centralAtomID % globals.latticeSize.x;
                        let centerRow = centralAtomID / globals.latticeSize.x;

                        for(var r: i32 = -2; r <= 2; r += 1) {
                            for(var c: i32 = -2 ; c <= 2; c += 1) {

                                let checkCol = i32(centerCol) + c;
                                let checkRow = i32(centerRow) + r;

                                if (checkCol >= 0 && checkCol < i32(globals.latticeSize.x) && checkRow >= 0 && checkRow < i32(globals.latticeSize.y)) {
                            
                                    let atomID = u32(checkRow) * globals.latticeSize.x + u32(checkCol);

                                    let atom = atoms[atomID];
                                    if (posToMorton(atom.pos) == i){

                                        if (atom.coreCharge >= 0){
                                            posWieghtedSum +=  atom.pos * atom.coreCharge;
                                            posChargeSum += atom.coreCharge;
                                            posCount += 1u;
                                            temp += atom.temp;
                                        }else{
                                            negWieghtedSum +=  atom.pos * atom.coreCharge;
                                            negChargeSum += atom.coreCharge;
                                            negCount += 1u;
                                            temp += atom.temp;
                                        }
                                    }

                                    if (posToMorton(atom.negPole) == i){
                                        if (atom.shellCharge >= 0.0){
                                            posWieghtedSum += atom.negPole * atom.shellCharge;
                                            posChargeSum += atom.shellCharge;
                                            posCount += 1u;
                                        } else {
                                            negWieghtedSum += atom.negPole * atom.shellCharge;
                                            negChargeSum += atom.shellCharge;
                                            negCount += 1u;
                                        }
                                    }
                                }
                            }
                        }
                    }
                                    
                    
                    if (posChargeSum > 0.0) {
                        quad[quadID].posCenter = posWieghtedSum / posChargeSum;
                    }else {
                        quad[quadID].posCenter = vec2f(0.0, 0.0);
                    } 
                
                    quad[quadID].posCharge = posChargeSum;
                    quad[quadID].posCount = posCount;

                    if (negChargeSum < 0.0) {
                        quad[quadID].negCenter = negWieghtedSum / negChargeSum;
                    }else {
                        quad[quadID].negCenter = vec2f(0.0, 0.0);
                    }
                
                    quad[quadID].negCharge = negChargeSum;
                    quad[quadID].negCount = negCount;
                    quad[quadID].temp = temp;
                
                }

                @compute @workgroup_size(${WORKGROUP_SIZE})
                fn branch(@builtin(global_invocation_id) id: vec3u) {
                
//safety check ignore
                    let i = id.x; 
                    if (i >= globals.nodesThisLevel) { return; } 
//safety check ignore

                    let parentID = globals.levelOffset + i;
                    let childBase = globals.childOffset + i * 4u;
                    
                    var posWieghtedSum = vec2f(0.0,0.0);
                    var posChargeSum: f32 = 0.0;
                    var posCount: u32 = 0u;
                    var negWieghtedSum = vec2f(0.0,0.0);
                    var negChargeSum: f32 = 0.0;
                    var negCount: u32 = 0u;
                    var temp: f32 = 0.0;

                    for (var c: u32 = 0u; c < 4u; c++) {

                        let child = quad[childBase + c];

                        if (child.posCount > 0u){
                            posWieghtedSum +=  child.posCenter * child.posCharge;
                            posChargeSum += child.posCharge;
                            posCount += child.posCount;
                        }

                        if (child.negCount > 0u){
                            negWieghtedSum +=  child.negCenter * child.negCharge;
                            negChargeSum += child.negCharge;
                            negCount += child.negCount;
                        }

                        temp += child.temp;
                    }

                    if (posChargeSum > 0.0) {
                        quad[parentID].posCenter = posWieghtedSum / posChargeSum;
                    }else {
                        quad[parentID].posCenter = vec2f(0.0, 0.0);
                    }
                
                    quad[parentID].posCharge = posChargeSum;
                    quad[parentID].posCount = posCount;

                    if (negChargeSum < 0.0) {
                        quad[parentID].negCenter = negWieghtedSum / negChargeSum;
                    }else {
                        quad[parentID].negCenter = vec2f(0.0, 0.0);
                    }
                
                    quad[parentID].negCharge = negChargeSum;
                    quad[parentID].negCount = negCount;
                    quad[parentID].temp = temp/4;
                }

            `
        });

    

    /*DRAW SHADER

        const RenderShaderModule = device.createShaderModule({

                struct VertexInput {

                @group(0) @binding(3) var<storage, read> atoms: array<Atom>;


                fn part1by1(x: u32) -> u32 {
                    var v = x & 0xffu;

                    v = (v | (v << 2u)) & 0x33333333u;
                    v = (v | (v << 1u)) & 0x55555555u;

                }

                fn compact1by1(x: u32) -> u32 {
                    var v = x & 0x55555555u;
                    v = (v | (v >> 1u)) & 0x33333333u;
                    v = (v | (v >> 2u)) & 0x0f0f0f0fu;
                    v = (v | (v >> 4u)) & 0x00ff00ffu;

                fn posToMorton(pos: vec2f) -> u32 {

                    let simMin = -globals.simHalf;
                    let simSize = globals.simSize;

                    let y = u32(clamp(norm.y * f32(globals.gridRes.y), 0.0, f32(globals.gridRes.y-1)));

                fn mortonToPos(morton: u32) -> vec2f {

                    let x = compact1by1(m);
                    let y = compact1by1(m >> 1u);

                    let cell = vec2f(f32(x), f32(y));
                    let cellSize = globals.simSize / vec2f(f32(globals.gridRes.x), f32(globals.gridRes.y));

                    return (-globals.simHalf) + cell * cellSize + cellSize * 0.5;
                }
// CELL VERTEX SHADER
                @vertex
                fn vertexCell(input: VertexInput, @builtin(vertex_index) vertex_index: u32) -> VertexOutput {
                    var output: VertexOutput;  
                    
                    let level = globals.draw_grid_depth;
                    let nodesPerAxis = 1u << level;
                    let nodeIndex = input.instance;
                    let x = compact1by1(nodeIndex);
                    let y = compact1by1(nodeIndex >> 1u);
                    let cellSize = globals.simSize / vec2f(f32(nodesPerAxis), f32(nodesPerAxis));
                    let cellCenter = -globals.simHalf + (vec2f(f32(x), f32(y)) + 0.5) * cellSize;
                    let pos = cellCenter + input.pos * (cellSize * 0.5);

                    output.pos = vec4f(pos / globals.simHalf, 0.0, 1.0);
                    output.uv = input.pos;
                    output.instanceID = input.instance;

                    return output;
                }

// CELL CHARGE FRAGMENT SHADER 
                @fragment
                fn fragmentCellCharge(input: VertexOutput) -> @location(0) vec4f {
                    let dist = length(input.uv);
                                            
                    let mortID = globals.draw_grid_start + input.instanceID;
                    var color = vec4f(0.0, 0.0, 0.0, 0.0);
                    let netCharge = quad[mortID].posCharge + quad[mortID].negCharge;
                    let temp = quad[mortID].temp;
                    
                    if (netCharge <= 0.0){

                        var alpha: f32 = abs(f32(netCharge) / globals.eCharge) * ${BIN_ALPHA_FACTOR};
                        var tempAlpha: f32 = f32(temp) * ${TEMP_ALPHA_FACTOR};

                        if (alpha > 1.0){
                            alpha = 1.0;
                        }

                        //color = vec4f(0.0, min(1.0,tempAlpha), 1.0, alpha);
                        color = vec4f(0.0, 0.0, 1.0, alpha);
                    }else{
                    
                        var alpha: f32 = abs(f32(netCharge)/globals.eCharge) * ${BIN_ALPHA_FACTOR};
                        var tempAlpha: f32 = f32(temp) * ${TEMP_ALPHA_FACTOR};

                        if (alpha > 1.0){
                            alpha = 1.0;
                        }

                        //color = vec4f(1.0, min(1.0,tempAlpha), 0.0, alpha);
                        color = vec4f(1.0, 0.0, 0.0, alpha);

                    }
                    
                    return color;
                }

// CELL COUNT FRAGMENT SHADER 
                @fragment
                fn fragmentCellCount(input: VertexOutput) -> @location(0) vec4f {
                    let dist = length(input.uv);
                                            
                    let mortID = globals.draw_grid_start + input.instanceID;
                    let netCount = quad[mortID].posCount + quad[mortID].negCount;

                    var alpha: f32 = f32(netCount) * ${BIN_ALPHA_FACTOR};

                    if (alpha > 1.0){

                    if (atom.eID > ${NUM_OF_ELECTRONS}){

                    }else{

                    }
                    
                    
                }


// ELECTRON VERTEX SHADER
                @vertex
                fn vertexElectron(input: VertexInput, @builtin(vertex_index) vertex_index: u32) -> VertexOutput {
                    var output: VertexOutput;  

                    let electron = electrons[input.instance];
                    let pos = electron.pos + input.pos * globals.eVisRadius ;
                    
                    output.pos = vec4f(pos / globals.simHalf , 0.0, 1.0);
                    output.uv = input.pos;
                    output.instanceID = input.instance;
                    return output;
                }


// PRETTIER SLOWER ELECTRONS
                @fragment
                fn fragmentElectron(input: VertexOutput) -> @location(0) vec4f {

                        
                    
                    if (electrons[input.instanceID].atomID >=  ${NUM_OF_ATOMS} ){
                    
                        let dist = length(input.uv);
                    
                        let radius: f32 = .5; 
                        let fadeWidth: f32 = .001; 

                        let alpha = 1.0 - smoothstep(radius - fadeWidth, radius, dist);
                        
                        if alpha < 0.001 {
                            discard;
                        }

                        if(electrons[input.instanceID].pad2 == 1){
                            return vec4f(0.0, 0.5, 0.5, alpha);
                        }else{
                            return vec4f(0.5, 0.5, 0.5, alpha);
                        }
                        
                        

                    }else{
                        let dist = length(input.uv);
                        let radius2start: f32 = 0.7; 
                        let radius2end: f32 = 0.5; 
                        let fadeWidth2: f32 = 0.01;
                        let alpha2 = 1.0 - smoothstep(radius2end - fadeWidth2, radius2end, dist);
                        return vec4f(1.0, 0.0, 1.0, 0.0);
                    }
                    
                }
            `
        });


//PIPLINES

    /*RENDER PIPELINE
    
    */

        var cellEntryPoint = "";

        switch(cellType) {
            case "char":
                cellEntryPoint = "fragmentCellCharge";
                break;
            case "count":
                cellEntryPoint = "fragmentCellCount";
                break;
            case "temp":
                cellEntryPoint = "fragmentCellTemp";
                break;
            default:
                cellEntryPoint = 'fragmentCellCount';
        }

        const CellRenderPipeline = device.createRenderPipeline({
            label: "cell render pipeline",
            layout: RenderPipelineLayout,
            vertex: {
                module: RenderShaderModule,
                entryPoint: "vertexCell",
                buffers: [vertexBufferLayout]
            },
            fragment: {
                module: RenderShaderModule,
                entryPoint: cellEntryPoint,
                targets: [{
                    format: simCanvasFormat,
                    blend: { 
                        color: {
                            srcFactor: "src-alpha",
                            dstFactor: "one-minus-src-alpha",
                            operation: "add"
                        },
                        alpha: {
                            srcFactor: "one",
                            dstFactor: "one-minus-src-alpha",
                            operation: "add"
                        }
                    }
                }]
            }
        });

        const AtomRenderPipeline = device.createRenderPipeline({
            label: "atom render pipeline",
            layout: RenderPipelineLayout,
            vertex: {
                module: RenderShaderModule,
                entryPoint: "vertexAtom",
                buffers: [vertexBufferLayout]
            },
            fragment: {
                module: RenderShaderModule,
                entryPoint:"fragmentAtom",
                targets: [{
                    format: simCanvasFormat,
                    blend: { 
                        color: {
                            srcFactor: "src-alpha",
                            dstFactor: "one-minus-src-alpha",
                            operation: "add"
                        },
                        alpha: {
                            srcFactor: "one",
                            dstFactor: "one-minus-src-alpha",
                            operation: "add"
                        }
                    }
                }]
            }
        });

        const ElectronRenderPipeline = device.createRenderPipeline({
            label: "cell render pipeline",
            layout: RenderPipelineLayout,
            vertex: {
                module: RenderShaderModule,
                entryPoint: "vertexElectron",
                buffers: [vertexBufferLayout]
            },
            fragment: {
                module: RenderShaderModule,
                entryPoint: "fragmentElectron",
                targets: [{
                    format: simCanvasFormat,
                    blend: { 
                        color: {
                            srcFactor: "src-alpha",
                            dstFactor: "one-minus-src-alpha",
                            operation: "add"
                        },
                        alpha: {
                            srcFactor: "one",
                            dstFactor: "one-minus-src-alpha",
                            operation: "add"
                        }
                    }
                }]
            }
        });


    /*SIMULATION PIPELINE
    
    */

        const FirstDynamicPipeline = device.createComputePipeline({
                label: "first dynamic compute pipeline",
                layout: ComputePipelineLayout,
                compute: {
                    module: ComputeShaderModule ,
                    entryPoint: "firstDynamic",
                }
        });

        const Pass1BlockScanPipeline = device.createComputePipeline({
                label: "Pass 1: Block Scan",
                layout: SortPipelineLayout,
                compute: {
                    module: SortShaderModule ,
                    entryPoint: "pass1_block_scan",
                }
        });

        const Pass2ScanBlocksPipeline = device.createComputePipeline({
                label: "Pass 2: Scan Blocks",
                layout: SortPipelineLayout,
                compute: {
                    module: SortShaderModule ,
                    entryPoint: "pass2_scan_blocks",
                }
        });

        const Pass3AddBlocksPipeline = device.createComputePipeline({
                label: "Pass 3: Add Blocks",
                layout: SortPipelineLayout,
                compute: {
                    module: SortShaderModule ,
                    entryPoint: "pass3_add_blocks",
                }
        });

        const ClearBinsPipeline = device.createComputePipeline({
                label: "clear bins and shit idk",
                layout: SortPipelineLayout,
                compute: {
                    module: SortShaderModule ,
                    entryPoint: "clearBins",
                }
        });

        const CreateMovementArrayPipeline = device.createComputePipeline({
                label: "organize particle in holder array",
                layout: SortPipelineLayout,
                compute: {
                    module: SortShaderModule ,
                    entryPoint: "createMovementArray",
                }
        });

        const SwapPipeline = device.createComputePipeline({
                label: "swap particles with holder array",
                layout: SortPipelineLayout,
                compute: {
                    module: SortShaderModule ,
                    entryPoint: "swap",
                }
        });

        const BHQuadClearPipeline = device.createComputePipeline({
            label: "clear barnes-hut bins",
            layout: BHQuadPipelineLayout,
            compute: {
                module: BHQuadShaderModule ,
                entryPoint: "clear",
            }
        });

        const BHQuadLeafPipeline = device.createComputePipeline({
                label: "barnes-hut leaf nodes",
                layout: BHQuadPipelineLayout,
                compute: {
                    module: BHQuadShaderModule ,
                    entryPoint: "leaves",
                }
        });

        const BHQuadBranchPipeline = device.createComputePipeline({
                label: "barnes-hut branch nodes",
                layout: BHQuadPipelineLayout,
                compute: {
                    module: BHQuadShaderModule ,
                    entryPoint: "branch",
                }
        });

        const UpdateAtomsPipeline = device.createComputePipeline({
            label: "update atoms state pipeline",
            layout: ComputePipelineLayout,
            compute: {
                module: ComputeShaderModule ,
                entryPoint: "updateAtoms",
            }
        });

        const CollisionPipeline = device.createComputePipeline({
            label: "electron-atom collision pipeline",
            layout: ComputePipelineLayout,
            compute: {
                module: ComputeShaderModule ,
                entryPoint: "collision",
            }
        });

        
        const BinElectronsPipeline = device.createComputePipeline({
            label: "atomic add local id pipeline",
            layout: ComputePipelineLayout,
            compute: {
                module: ComputeShaderModule ,
                entryPoint: "binElectrons",
            }
        });



//MAIN FUNCTIONS

    /*COMPUTE/UPDATE
    
    */
        function update(){

            f32[0] = ((dt_s + .006)/2) * timeFactor;
            f32[1] = frameSeed;
            f32[2] = PIXEL_SIZE_A;
            f32[3] = gridCellSize_A;

            f32[4] = simSize_A.x;
            f32[5] = simSize_A.y;

            f32[6] = simHalf_A.x;
            f32[7] = simHalf_A.y;

            u32[8] = gridSize_int.x;
            u32[9] = gridSize_int.y;



            device.queue.writeBuffer(globalsUniformBuffer, 0, globals);
                        
            const ComputeEncoder = device.createCommandEncoder();
            const ComputePass = ComputeEncoder.beginComputePass();

            ComputePass.setPipeline(ClearBinsPipeline);
            ComputePass.setBindGroup(0, SortBindGroups[step % 2]);
            ComputePass.dispatchWorkgroups(Math.ceil( gridResolution / WORKGROUP_SIZE));

            ComputePass.setPipeline(FirstDynamicPipeline);
            ComputePass.setBindGroup(0, ComputeBindGroups[step % 2]);
            ComputePass.dispatchWorkgroups(Math.ceil(Math.ceil(NUM_OF_ELECTRONS / WORKGROUP_SIZE)/DISPATCH_LAYERS),DISPATCH_LAYERS,1);

            ComputePass.setPipeline(UpdateAtomsPipeline);
            ComputePass.setBindGroup(0, ComputeBindGroups[step % 2]);
            ComputePass.dispatchWorkgroups(Math.ceil(NUM_OF_ATOMS / WORKGROUP_SIZE));

            ComputePass.setPipeline(CollisionPipeline);
            ComputePass.setBindGroup(0, ComputeBindGroups[step % 2]);
            ComputePass.dispatchWorkgroups(Math.ceil(Math.ceil(NUM_OF_ELECTRONS / WORKGROUP_SIZE)/DISPATCH_LAYERS),DISPATCH_LAYERS,1);

            ComputePass.setPipeline(BinElectronsPipeline);
            ComputePass.setBindGroup(0, ComputeBindGroups[step % 2]);
            ComputePass.dispatchWorkgroups(Math.ceil(Math.ceil(NUM_OF_ELECTRONS / WORKGROUP_SIZE)/DISPATCH_LAYERS),DISPATCH_LAYERS,1);

            ComputePass.setPipeline(Pass1BlockScanPipeline);
            ComputePass.setBindGroup(0, SortBindGroups[step % 2]);
            ComputePass.dispatchWorkgroups(Math.ceil(gridResolution / 256));

            ComputePass.setPipeline(Pass2ScanBlocksPipeline);
            ComputePass.setBindGroup(0, SortBindGroups[step % 2]);
            ComputePass.dispatchWorkgroups(1);

            ComputePass.setPipeline(Pass3AddBlocksPipeline);
            ComputePass.setBindGroup(0, SortBindGroups[step % 2]);
            ComputePass.dispatchWorkgroups(Math.ceil(gridResolution / 256));

            ComputePass.setPipeline(CreateMovementArrayPipeline);
            ComputePass.setBindGroup(0, SortBindGroups[step % 2]);
            ComputePass.dispatchWorkgroups(Math.ceil(Math.ceil(NUM_OF_ELECTRONS / WORKGROUP_SIZE)/DISPATCH_LAYERS),DISPATCH_LAYERS,1);

            ComputePass.setPipeline(SwapPipeline);
            ComputePass.setBindGroup(0, SortBindGroups[step % 2]);
            ComputePass.dispatchWorkgroups(Math.ceil(Math.ceil(NUM_OF_ELECTRONS / WORKGROUP_SIZE)/DISPATCH_LAYERS),DISPATCH_LAYERS,1);

            ComputePass.setPipeline(BHQuadClearPipeline);
            ComputePass.setBindGroup(0, BHQuadBindGroups[step % 2]);
            ComputePass.dispatchWorkgroups(Math.ceil(NUM_QUADS / WORKGROUP_SIZE));

            ComputePass.setPipeline(BHQuadLeafPipeline);
            ComputePass.setBindGroup(0, BHQuadBindGroups[step % 2]);
            ComputePass.dispatchWorkgroups(Math.ceil(gridResolution / WORKGROUP_SIZE));

            ComputePass.end();
            device.queue.submit([ComputeEncoder.finish()]);

            for (let level = treeDepth_int-1; level >= 0; level--) {

                u32[15] = level;  //currentLevel

                u32[16] = (4**level - 1) / 3; //levelOffset
                u32[17] = ((4**(level + 1) - 1) / 3) ; //childOffset

                u32[18] = Math.pow(4, level); //nodesThisLevel

                device.queue.writeBuffer(globalsUniformBuffer, 0, globals);

                const loopEncoder = device.createCommandEncoder();
                const pass = loopEncoder.beginComputePass();

                pass.setPipeline(BHQuadBranchPipeline);
                pass.setBindGroup(0, BHQuadBindGroups[step % 2]);
                pass.dispatchWorkgroups(Math.ceil( Math.pow(4, level) / WORKGROUP_SIZE));
                
                pass.end();
                device.queue.submit([loopEncoder.finish()]);
            }
            


        }

    /*RENDER
    
    */
        function render() {

            const renderEncoder = device.createCommandEncoder();

            var RenderPass;
            if (TRACERS){
                RenderPass = renderEncoder.beginRenderPass({
                    colorAttachments: [{
                        view: persistentTexture.createView(), 
                        loadOp: "load",
                        storeOp: "store",
                    }]
                });
            }else{
                RenderPass = renderEncoder.beginRenderPass({
                    colorAttachments: [{
                        view: persistentTexture.createView(), 
                        loadOp: "clear",
                        storeOp: "store",
                    }]
                });
            }
            
            
            

            RenderPass.setBindGroup(0, RenderBindGroups[(step +1) % 2]);
            RenderPass.setVertexBuffer(0, vertexBuffer);

            if (DRAW_GRID){
                RenderPass.setPipeline(CellRenderPipeline);
                RenderPass.draw(6, Math.pow(4, DRAW_GRID_DEPTH), 0, 0);
            } 

            
            if(draw_atoms){
                RenderPass.setPipeline(AtomRenderPipeline);
                RenderPass.draw(3, NUM_OF_ATOMS, 6, 0);
            }
            
            if(draw_electrons){
                RenderPass.setPipeline(ElectronRenderPipeline);
                RenderPass.draw(3, NUM_OF_ELECTRONS, 6, 0); 
            }


            RenderPass.end();

            const currentCanvasTexture = context.getCurrentTexture();
            
            renderEncoder.copyTextureToTexture(
                { texture: persistentTexture },
                { texture: currentCanvasTexture },
                [simCanvas.width, simCanvas.height]
            );

            device.queue.submit([renderEncoder.finish()]);

        }
        


//MAIN LOOP


        function frame() {
            frames++;

            const NOW_MS = performance.now();
            dt_ms = NOW_MS - lastT_ms;
            lastT_ms = NOW_MS;
            dt_s = dt_ms/1000;
            fps = 1/dt_s;

            fpsAccumulator += dt_ms;
            frameCountForFps++;

            if(SET_DT_S > 0){
                dt_s = SET_DT_S
            }

            if (fpsAccumulator >= 100) {
                fps = (frameCountForFps / fpsAccumulator) * 1000;
                
                fpsCounter.textContent = `FPS: ${fps.toFixed(2)} delT: ${dt_s.toFixed(4)}`;
                
                fpsAccumulator = 0;
                frameCountForFps = 0;
            }

            
        

            //simCanvas.width = document.getElementById('simSpace').clientWidth ;
            //simCanvas.height = document.getElementById('simSpace').clientHeight ;

            //simSize_A.x = simCanvas.width * PIXEL_SIZE_A ;
            //simSize_A.y = simCanvas.height * PIXEL_SIZE_A;

            //conversionWidth = 2 / simSize_A.x ;
            //conversionHeight = 2 / simSize_A.y ;

            frameSeed = Math.random();


            update();
            render();


            step++;

            setTimeout(() => {requestAnimationFrame(frame);}, FRAME_DELAY_MS);
            //requestAnimationFrame(frame);
        }
        
        frame();



    </script>
</body>
